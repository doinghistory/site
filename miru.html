<title>観る｜歴史する</title>
<meta name="description" content="高校日本史の授業動画とおすすめ動画。時代から映像を探し、歴史の見方を広げる。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#f4f1ea;
  --paper2:#ebe6dc;
  --ink:#171714;
  --muted:#746d63;
  --line:#d6d0c4;
  --line-dark:#b9b1a3;
  --dark:#10100e;
  --accent:#4d493d;
  --serif:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);letter-spacing:.04em;
}
a{color:inherit}
button{font:inherit}
::selection{background:#d7cfbc}

/* header */
.site-header{
  height:78px;background:#faf8f3;color:var(--ink);
  border-bottom:1px solid rgba(0,0,0,.07);
  position:relative;z-index:30;
}
.header-inner{
  width:min(1280px,calc(100% - 52px));height:100%;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:28px;
}
.brand{text-decoration:none;line-height:1}
.brand-main{display:block;font-size:1.45rem;letter-spacing:.18em;font-weight:500}
.brand-sub{display:block;margin-top:7px;font:500 .56rem/1 var(--sans);letter-spacing:.24em;color:#686258}
.nav{display:flex;align-items:center;gap:34px}
.nav a{
  text-decoration:none;font-size:.84rem;padding:28px 4px 10px;
  border-bottom:1px solid transparent;
}
.nav a.active{border-color:#22201c}
.header-note{
  font-size:.73rem;line-height:1.7;color:#5f5a52;
  border-left:1px solid var(--line);padding-left:24px;
}

/* hero */
.hero{
  height:410px;position:relative;overflow:hidden;background:#161614;color:#fff;
}
.hero-image{
  position:absolute;inset:0;
  background-image:
    linear-gradient(90deg,rgba(10,10,9,.93) 0%,rgba(10,10,9,.78) 29%,rgba(10,10,9,.22) 53%,rgba(10,10,9,.22) 74%,rgba(10,10,9,.58) 100%),
    url("machikado-tv.jpg");
  background-size:cover;
  background-position:center 47%;
  filter:grayscale(1) contrast(1.02);
  transform:scale(1.005);
}
.hero-inner{
  position:relative;z-index:2;width:min(1280px,calc(100% - 52px));height:100%;margin:auto;
  display:flex;align-items:center;
}
.hero-copy{width:370px;margin-top:-2px}
.hero-eyebrow{font-size:.92rem;margin-bottom:12px}
.hero h1{
  margin:0;font-size:clamp(3.8rem,7.6vw,6.7rem);
  line-height:1;letter-spacing:.16em;font-weight:500;
}
.hero p{
  margin:28px 0 0;font-size:.84rem;line-height:2.15;max-width:345px;
}
.hero-rule{width:38px;height:1px;background:#fff;margin:27px 0 0}
.hero-small{
  margin-top:20px;font-size:.72rem;line-height:1.85;opacity:.86;
}
.hero-vertical{
  position:absolute;right:32px;top:44px;writing-mode:vertical-rl;
  font-size:.78rem;letter-spacing:.2em;line-height:2;color:rgba(255,255,255,.88);
}
.hero-caption{
  position:absolute;right:24px;bottom:16px;
  font:400 .58rem/1.5 var(--sans);color:rgba(255,255,255,.72);
}

/* era nav */
.era-area{background:#f7f4ee;border-bottom:1px solid var(--line)}
.era-major{
  width:min(1180px,calc(100% - 52px));margin:auto;
  display:grid;grid-template-columns:repeat(5,1fr);padding-top:20px;
}
.major-btn{
  appearance:none;background:transparent;border:1px solid var(--line);
  border-right:0;cursor:pointer;height:58px;color:#26231f;
  font-size:1.03rem;letter-spacing:.1em;transition:.2s;
}
.major-btn:last-child{border-right:1px solid var(--line)}
.major-btn:hover{background:#eee8dc}
.major-btn.active{
  background:#e2d7bd;border-color:#c8b994;
}
.sub-row{
  width:min(1180px,calc(100% - 52px));margin:auto;
  display:flex;justify-content:center;gap:8px;overflow-x:auto;
  scrollbar-width:none;padding:15px 0 19px;
}
.sub-row::-webkit-scrollbar{display:none}
.sub-btn{
  appearance:none;border:1px solid #d7d0c4;background:transparent;color:#6c665d;
  padding:8px 18px;cursor:pointer;flex:0 0 auto;
  font-size:.76rem;letter-spacing:.06em;
}
.sub-btn:hover{background:#ece6dc;color:#1d1b18}
.sub-btn.active{background:#dfd3b7;border-color:#cfbe96;color:#27231c}

/* main */
.main{padding:38px 0 88px}
.inner{width:min(1280px,calc(100% - 52px));margin:auto}
.section{margin-top:34px}
.section:first-child{margin-top:0}
.section-heading{
  display:flex;align-items:center;gap:22px;margin-bottom:18px;
}
.section-heading h2{
  margin:0;font-size:1.35rem;font-weight:500;letter-spacing:.1em;
}
.section-heading .line{width:40px;height:1px;background:#777168}
.section-heading p{
  margin:0;color:#70695f;font:400 .68rem/1.7 var(--sans);
}
.section-heading .more{
  margin-left:auto;text-decoration:none;font-size:.72rem;color:#514c44;
}

/* class videos */
.class-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.class-card{
  display:grid;grid-template-columns:1.05fr 1fr;
  min-height:175px;border:1px solid var(--line);background:#f8f5ef;
  text-decoration:none;overflow:hidden;transition:.2s;
}
.class-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.05)}
.class-thumb{
  position:relative;min-height:175px;background:#8a8376;overflow:hidden;
}
.class-thumb:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.36)),
    linear-gradient(135deg,#6f685c,#39372f 68%);
}
.class-thumb img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.67) contrast(1.01);transition:.35s;
}
.class-card:hover img{transform:scale(1.02)}
.duration{
  position:absolute;right:8px;bottom:8px;z-index:2;
  background:rgba(20,20,18,.78);color:#fff;padding:5px 8px;
  font:500 .61rem/1 var(--sans);
}
.class-copy{padding:22px 24px 18px}
.kicker{font:500 .61rem/1 var(--sans);letter-spacing:.12em;color:#746d64}
.class-copy h3{margin:10px 0 10px;font-size:1.12rem;line-height:1.55;font-weight:500}
.class-copy p{margin:0;color:#6f685f;font:400 .7rem/1.75 var(--sans)}
.source{margin-top:14px;color:#999187;font:400 .61rem/1.5 var(--sans)}

/* recommends */
.reco-strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);border-left:1px solid var(--line);
}
.reco-card{
  display:grid;grid-template-columns:118px 1fr;
  min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:#f8f5ef;text-decoration:none;transition:.2s;
}
.reco-card:hover{background:#efe9df}
.reco-thumb{
  position:relative;background:#8c8579;overflow:hidden;
}
.reco-thumb:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.28)),linear-gradient(135deg,#777063,#403d35 70%);
}
.reco-thumb img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.62);
}
.reco-copy{padding:12px 12px 10px}
.reco-era{font:500 .58rem/1 var(--sans);color:#80786e}
.reco-title{margin:7px 0 5px;font-size:.81rem;line-height:1.45}
.reco-source{font:400 .57rem/1.5 var(--sans);color:#9a9287}
.reco-arrow{float:right;margin-left:6px;font-family:var(--sans)}

.empty{
  grid-column:1/-1;padding:48px 20px;text-align:center;
  border:1px solid var(--line);color:#887f74;font:400 .76rem/1.8 var(--sans);
}

/* player */
.player{
  position:fixed;inset:0;z-index:100;background:rgba(9,9,8,.96);
  display:none;align-items:center;justify-content:center;padding:34px;
}
.player.open{display:flex}
.player-inner{width:min(1080px,100%)}
.player-screen{aspect-ratio:16/9;background:#000;position:relative}
.player-screen iframe{width:100%;height:100%;border:0}
.player-fallback{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:#d5cfc4;background:#171714;padding:30px;font:400 .77rem/1.9 var(--sans);
}
.player-close{
  position:absolute;right:28px;top:20px;border:0;background:transparent;color:#fff;
  font:300 2rem/1 var(--sans);cursor:pointer;
}

/* footer */
.footer{
  border-top:1px solid var(--line);padding:22px 0 32px;
  color:#8a8378;font:400 .61rem/1.7 var(--sans);
}
.footer-inner{
  width:min(1280px,calc(100% - 52px));margin:auto;
  display:flex;justify-content:space-between;gap:20px;
}

/* responsive */
@media(max-width:1040px){
  .header-note{display:none}
  .class-grid{grid-template-columns:1fr}
  .reco-strip{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .nav{display:none}
  .site-header{height:70px}
  .header-inner,.hero-inner,.inner,.footer-inner{width:calc(100% - 28px)}
  .brand-main{font-size:1.2rem}
  .hero{height:460px}
  .hero-image{
    background-position:63% 48%;
    background-image:
      linear-gradient(90deg,rgba(8,8,7,.93) 0%,rgba(8,8,7,.78) 45%,rgba(8,8,7,.24) 78%,rgba(8,8,7,.38) 100%),
      url("machikado-tv.jpg");
  }
  .hero-copy{width:72%}
  .hero-vertical{display:none}
  .era-major{width:100%;overflow-x:auto;grid-template-columns:repeat(5,145px);padding-left:14px;padding-right:14px}
  .sub-row{width:calc(100% - 28px);justify-content:flex-start}
  .class-card{grid-template-columns:1fr}
  .class-thumb{min-height:190px}
  .reco-strip{grid-template-columns:1fr}
}

/* ===== update: unified header + top-page font ===== */
:root{
  --mincho:"Shippori Mincho B1",serif;

}

/* ===== unified site header / brush hero ===== */
:root{
  --site-paper:#f2ebdb;
  --site-gold:#c4a35c;
  --site-mincho:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
  --site-gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
}
.unified-header{
  position:fixed !important;
  inset:0 0 auto 0 !important;
  height:72px !important;
  z-index:1000 !important;
  background:rgba(10,10,9,.76) !important;
  border-bottom:1px solid rgba(255,255,255,.10) !important;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--site-paper);
}
.unified-header-inner{
  width:min(1280px,calc(100% - 44px));
  height:100%;
  margin:auto;
  display:grid;
  grid-template-columns:170px 1fr 52px;
  align-items:center;
  gap:24px;
}
.unified-brand{
  color:var(--site-paper);
  text-decoration:none;
  font-family:var(--site-mincho);
  font-size:1.15rem;
  font-weight:500;
  letter-spacing:.20em;
  white-space:nowrap;
}
.unified-nav{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(16px,2.2vw,34px);
  min-width:0;
}
.unified-nav a{
  color:#eee7d9;
  text-decoration:none;
  font-family:var(--site-mincho);
  font-size:.83rem;
  font-weight:500;
  letter-spacing:.14em;
  white-space:nowrap;
  position:relative;
  padding:8px 1px;
  transition:.22s ease;
}
.unified-nav a::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:1px;
  width:0;
  height:1px;
  background:var(--site-gold);
  transform:translateX(-50%);
  transition:.22s ease;
}
.unified-nav a:hover,
.unified-nav a.active{color:var(--site-gold);}
.unified-nav a:hover::after,
.unified-nav a.active::after{width:100%;}
.unified-menu{
  width:44px;
  height:44px;
  border:1px solid rgba(242,235,219,.28);
  background:rgba(255,255,255,.02);
  border-radius:999px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
  padding:0;
  cursor:pointer;
  text-decoration:none;
}
.unified-menu span{
  display:block;
  width:18px;
  height:1px;
  background:var(--site-paper);
}
.hero h1{
  font-family:"kokuryu",var(--site-mincho) !important;
  font-weight:400 !important;
  letter-spacing:.09em !important;
}
@media(max-width:900px){
  .unified-header-inner{
    grid-template-columns:1fr 44px;
    width:calc(100% - 28px);
  }
  .unified-nav{display:none;}
  .unified-brand{font-size:1.05rem;}
}


/* ===== header alignment + shared menu drawer ===== */
.unified-header-inner{
  grid-template-columns:170px minmax(0,1fr) 52px !important;
}
.unified-nav{
  justify-content:flex-end !important;
  margin-left:auto !important;
}
.unified-menu{
  position:relative;
  z-index:1102;
}
body.menu-open{overflow:hidden;}
body.menu-open .unified-menu{
  background:transparent !important;
  border-color:#665e52 !important;
}
body.menu-open .unified-menu span{background:#1d1913 !important;}
body.menu-open .unified-menu span:nth-child(1){transform:translateY(7px) rotate(45deg);}
body.menu-open .unified-menu span:nth-child(2){opacity:0;}
body.menu-open .unified-menu span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

.unified-drawer{
  position:fixed;
  inset:0;
  z-index:1100;
  background:#f2ebdb;
  color:#1d1913;
  display:flex;
  align-items:center;
  justify-content:center;
  visibility:hidden;
  opacity:0;
  pointer-events:none;
  clip-path:circle(0 at calc(100% - 44px) 36px);
  transition:
    clip-path .72s cubic-bezier(.65,0,.35,1),
    opacity .15s linear,
    visibility 0s linear .72s;
}
body.menu-open .unified-drawer{
  visibility:visible;
  opacity:1;
  pointer-events:auto;
  clip-path:circle(150% at calc(100% - 44px) 36px);
  transition:
    clip-path .72s cubic-bezier(.65,0,.35,1),
    opacity .15s linear,
    visibility 0s linear 0s;
}
.unified-drawer-in{
  display:flex;
  flex-direction:row-reverse;
  gap:clamp(32px,6vw,76px);
}
.unified-drawer a{
  writing-mode:vertical-rl;
  height:min(50vh,390px);
  padding-top:10px;
  color:#453e32;
  text-decoration:none;
  font-family:var(--site-mincho,"Shippori Mincho B1",serif);
  font-size:clamp(1.05rem,2.4vh,1.42rem);
  font-weight:500;
  letter-spacing:.38em;
  position:relative;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .45s ease,transform .55s ease,color .22s ease;
}
.unified-drawer a::before{
  content:"";
  position:absolute;
  top:-7px;
  left:50%;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#a2937a;
  transform:translateX(-50%) scale(0);
  transition:.25s;
}
.unified-drawer a:hover{color:#1d1913;}
.unified-drawer a:hover::before{transform:translateX(-50%) scale(1);}
body.menu-open .unified-drawer a{opacity:1;transform:none;}
body.menu-open .unified-drawer a:nth-child(1){transition-delay:.18s;}
body.menu-open .unified-drawer a:nth-child(2){transition-delay:.26s;}
body.menu-open .unified-drawer a:nth-child(3){transition-delay:.34s;}
.unified-drawer-foot{
  position:absolute;
  left:0;
  right:0;
  bottom:28px;
  text-align:center;
  color:#6d6250;
  font-family:var(--site-gothic,"Zen Kaku Gothic New",sans-serif);
  font-size:.64rem;
  letter-spacing:.28em;
}
@media(max-width:900px){
  .unified-header-inner{grid-template-columns:1fr 44px !important;}
  .unified-nav{display:none !important;}
}

.wf-loading .hero h1{visibility:hidden}
.wf-active .hero h1,.wf-inactive .hero h1{visibility:visible}

<script src="site-config.js"></script>
<script>
const SUB_ERAS={
  "古代":["旧石器","縄文","弥生","古墳","飛鳥","奈良","平安"],
  "中世":["鎌倉","南北朝","室町","戦国"],
  "近世":["安土桃山","江戸","幕末"],
  "近代":["明治","大正","昭和戦前"],
  "現代":["戦後","平成","令和"]
};

const CSV_URL=(window.HISTORY_SITE_CONFIG && window.HISTORY_SITE_CONFIG.SHEET_CSV_URL)||"";
let VIDEOS=[];

function clean(v){return (v==null?"":String(v)).trim();}
function parseCSV(text){
  const out=[]; let row=[], field="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c === '"' && text[i+1] === '"'){field+='"';i++;}
      else if(c === '"') quoted=false;
      else field+=c;
    }else{
      if(c === '"') quoted=true;
      else if(c === ","){row.push(field);field="";}
      else if(c === "\n"){row.push(field);out.push(row);row=[];field="";}
      else if(c !== "\r") field+=c;
    }
  }
  row.push(field);
  if(row.length>1 || row[0]) out.push(row);
  return out;
}
function normalizeEra(v){
  return clean(v).replace(/\s+/g,"").replace(/時代$/,"")
    .replace(/昭和前期|昭和・戦前|戦前昭和/,"昭和戦前")
    .replace(/昭和後期|昭和・戦後|昭和戦後/,"戦後")
    .replace(/安土・桃山|安土桃山時代/,"安土桃山");
}
function majorOf(v){
  const s=normalizeEra(v);
  if(/旧石器|縄文|弥生|古墳|飛鳥|奈良|平安|原始|古代/.test(s)) return "古代";
  if(/鎌倉|南北朝|室町|戦国|中世/.test(s)) return "中世";
  if(/安土桃山|江戸|幕末|近世/.test(s)) return "近世";
  if(/明治|大正|昭和戦前|戦前|近代/.test(s)) return "近代";
  if(/戦後|平成|令和|現代/.test(s)) return "現代";
  return "";
}
function subOf(v){
  const s=normalizeEra(v);
  for(const e of Object.values(SUB_ERAS).flat()){
    if(s.includes(e)) return e;
  }
  if(s.includes("昭和") && !s.includes("戦後")) return "昭和戦前";
  if(s.includes("昭和") && s.includes("戦後")) return "戦後";
  return "";
}
function youtubeId(url){
  const s=clean(url);
  if(!s) return "";
  const m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/i);
  if(m) return m[1];
  try{
    const u=new URL(s);
    if(/youtube\.com$/i.test(u.hostname)||/www\.youtube\.com$/i.test(u.hostname)){
      return u.searchParams.get("v")||"";
    }
  }catch(e){}
  return "";
}
function videosFromCSV(text){
  const csv=parseCSV(text);
  if(!csv.length) return [];
  const h=csv[0].map(clean);
  return csv.slice(1).map(r=>{
    const o={}; h.forEach((k,i)=>o[k]=clean(r[i]));
    const kind=o["種別"]||o["種類"]||"";
    if(!kind.includes("動画")) return null;
    const rawEra=o["時代"]||"";
    const url=o["URL"]||o["リンク"]||"";
    const type=kind.includes("おすすめ") ? "おすすめ動画" : "授業動画";
    return {
      major:majorOf(rawEra),
      sub:subOf(rawEra),
      type,
      title:o["タイトル"]||o["教材名"]||"",
      desc:o["ひとこと説明"]||o["説明"]||o["概要"]||"",
      source:o["提供"]||o["出典"]||o["チャンネル"]||(type==="授業動画"?"歴史する":"おすすめ"),
      duration:o["時間"]||o["長さ"]||"",
      youtube:youtubeId(url),
      url
    };
  }).filter(Boolean).filter(v=>v.major && v.sub && v.title && v.url);
}

let currentMajor="古代";
let currentSub="";

function liveMode(){
  return /\.github\.io$/i.test(location.hostname);
}
function ytThumb(id){
  return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
}
function addThumb(el,id){
  if(!liveMode() || !id) return;
  const img=document.createElement("img");
  img.src=ytThumb(id);
  img.alt="";
  img.loading="lazy";
  el.appendChild(img);
}

function setFromUrl(){
  const q=new URLSearchParams(location.search).get("era")||"";
  if(SUB_ERAS[q]){currentMajor=q;return;}
  for(const major of Object.keys(SUB_ERAS)){
    if(SUB_ERAS[major].includes(q)){currentMajor=major;currentSub=q;return;}
  }
}
function updateUrl(){
  const u=new URL(location.href);
  u.searchParams.set("era",currentSub||currentMajor);
  history.replaceState(null,"",u);
}

function renderSub(){
  const row=document.getElementById("subRow");
  row.innerHTML=
    `<button class="sub-btn ${currentSub===""?"active":""}" data-sub="">すべて</button>`+
    SUB_ERAS[currentMajor].map(s=>
      `<button class="sub-btn ${currentSub===s?"active":""}" data-sub="${s}">${s}</button>`
    ).join("");

  row.querySelectorAll(".sub-btn").forEach(btn=>{
    btn.onclick=()=>{
      currentSub=btn.dataset.sub||"";
      updateUrl();
      render();
    };
  });
}

function filtered(type){
  return VIDEOS.filter(v=>{
    if(v.major!==currentMajor) return false;
    if(currentSub && v.sub!==currentSub) return false;
    if(v.type!==type) return false;
    return true;
  });
}

function render(){
  document.querySelectorAll(".major-btn").forEach(
    b=>b.classList.toggle("active",b.dataset.major===currentMajor)
  );
  renderSub();

  const classVideos=filtered("授業動画");
  const recos=filtered("おすすめ動画");

  const cg=document.getElementById("classGrid");
  if(!classVideos.length){
    cg.innerHTML='<div class="empty">この時代の授業動画は、まだ登録されていません。</div>';
  }else{
    cg.innerHTML="";
    classVideos.forEach(v=>{
      const a=document.createElement("a");
      a.href="#";
      a.className="class-card";
      a.innerHTML=`
        <div class="class-thumb">
          ${v.duration?`<span class="duration">${v.duration}</span>`:""}
        </div>
        <div class="class-copy">
          <div class="kicker">${v.sub}</div>
          <h3>${v.title}</h3>
          <p>${v.desc}</p>
          <div class="source">${v.source}</div>
        </div>`;
      addThumb(a.querySelector(".class-thumb"),v.youtube);
      a.onclick=e=>{e.preventDefault(); v.youtube ? openPlayer(v) : window.open(v.url,"_blank","noopener");};
      cg.appendChild(a);
    });
  }

  const rs=document.getElementById("recoStrip");
  if(!recos.length){
    rs.innerHTML='<div class="empty">この時代のおすすめ動画は、まだ登録されていません。</div>';
  }else{
    rs.innerHTML="";
    recos.forEach(v=>{
      const a=document.createElement("a");
      a.href="#";
      a.className="reco-card";
      a.innerHTML=`
        <div class="reco-thumb"></div>
        <div class="reco-copy">
          <div class="reco-era">${v.sub}</div>
          <div class="reco-title">${v.title}<span class="reco-arrow">›</span></div>
          <div class="reco-source">${v.source}</div>
        </div>`;
      addThumb(a.querySelector(".reco-thumb"),v.youtube);
      a.onclick=e=>{e.preventDefault(); v.youtube ? openPlayer(v) : window.open(v.url,"_blank","noopener");};
      rs.appendChild(a);
    });
  }
}

function openPlayer(v){
  const screen=document.getElementById("playerScreen");
  if(liveMode()){
    screen.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.youtube}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  }else{
    screen.innerHTML='<div class="player-fallback">GitHub Pages上では、ここにYouTube動画が表示されます。<br>ChatGPT内プレビューでは外部通信を行いません。</div>';
  }
  document.getElementById("player").classList.add("open");
}
function closePlayer(){
  document.getElementById("player").classList.remove("open");
  document.getElementById("playerScreen").innerHTML="";
}
document.getElementById("playerClose").onclick=closePlayer;
document.getElementById("player").onclick=e=>{
  if(e.target.id==="player") closePlayer();
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closePlayer();
});

document.querySelectorAll(".major-btn").forEach(btn=>{
  btn.onclick=()=>{
    currentMajor=btn.dataset.major;
    currentSub="";
    updateUrl();
    render();
  };
});

setFromUrl();
render();

if(CSV_URL){
  fetch(CSV_URL,{cache:"no-store"})
    .then(r=>{if(!r.ok) throw new Error("CSV"); return r.text();})
    .then(text=>{ VIDEOS=videosFromCSV(text); render(); })
    .catch(()=>{ VIDEOS=[]; render(); });
}
</script>

<script>
(function(){
  const btn=document.querySelector('.unified-menu');
  const drawer=document.getElementById('unifiedDrawer');

    document.body.classList.toggle('menu-open');
  });
  drawer.querySelectorAll('a').forEach(function(a){

    });

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') document.body.classList.remove('menu-open');
  });
})();
</script>
