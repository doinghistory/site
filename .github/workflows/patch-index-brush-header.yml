name: Patch index brush header

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-index-brush-header.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          c=p.read_text(encoding="utf-8")

          preload='''<!-- instant-brush-header-preload -->
          <link rel="preload" as="image" href="header-brand.png">
          <link rel="preload" as="image" href="header-manabu.png">
          <link rel="preload" as="image" href="header-tou.png">
          <link rel="preload" as="image" href="header-kitaeru.png">
          <link rel="preload" as="image" href="header-miru.png">
          <link rel="preload" as="image" href="header-shiraberu.png">
          <link rel="preload" as="image" href="header-meguru.png">'''

          css='''/* ===== instant brush header images ===== */
          .unified-brand{display:flex !important;align-items:center !important;min-width:150px;font-size:0 !important;line-height:1 !important}
          .unified-brand img{display:block;width:auto;height:31px;object-fit:contain}
          .unified-nav a{display:flex !important;align-items:center;justify-content:center;min-width:38px;min-height:42px;font-size:0 !important;line-height:1 !important}
          .unified-nav a img{display:block;width:auto;height:27px;object-fit:contain;opacity:.88;transition:opacity .2s ease,transform .2s ease,filter .2s ease}
          .unified-nav a:hover img,.unified-nav a.active img{opacity:1;transform:translateY(-1px)}
          @media(max-width:900px){.unified-brand img{height:29px}}'''

          header='''<header class="unified-header">
            <div class="unified-header-inner">
              <a class="unified-brand" href="index.html#top" aria-label="歴史する"><img src="header-brand.png" alt="歴史する" decoding="sync" fetchpriority="high"></a>
              <nav class="unified-nav">
                <a href="manabu.html" aria-label="学ぶ"><img src="header-manabu.png" alt="学ぶ" decoding="sync"></a>
                <a href="tou.html" aria-label="問う"><img src="header-tou.png" alt="問う" decoding="sync"></a>
                <a href="kitaeru.html" aria-label="鍛える"><img src="header-kitaeru.png" alt="鍛える" decoding="sync"></a>
                <a href="miru.html" aria-label="観る"><img src="header-miru.png" alt="観る" decoding="sync"></a>
                <a href="shiraberu.html" aria-label="調べる"><img src="header-shiraberu.png" alt="調べる" decoding="sync"></a>
                <a href="meguru.html" aria-label="巡る"><img src="header-meguru.png" alt="巡る" decoding="sync"></a>
              </nav>
              <button class="unified-menu" id="hamb" type="button" aria-label="メニュー"><span></span><span></span><span></span></button>
            </div>
          </header>'''

          if "instant-brush-header-preload" not in c:
              c=c.replace("</head>", preload+"\n</head>", 1)
          c=re.sub(r'<header class="unified-header">.*?</header>', header, c, count=1, flags=re.S)
          if "instant brush header images" not in c:
              c=c.replace("</style>", css+"\n</style>", 1)

          p.write_text(c,encoding="utf-8")
          PY
      - name: Commit patched index
        run: |
          git config user.name "doinghistory-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use instant brush image header on top page"
          git push
