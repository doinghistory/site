name: Patch index brush header

on:
  push:
    paths:
      - '.github/workflows/patch-index-brush-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index header to brush images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          s=re.sub(
              r'<a class="unified-brand"([^>]*)>歴史する</a>',
              r'<a class="unified-brand"\1><img src="header-brand.png" alt="歴史する"></a>',
              s,
              count=1
          )

          mapping={
              "学ぶ":"header-manabu.png",
              "問う":"header-tou.png",
              "鍛える":"header-kitaeru.png",
              "観る":"header-miru.png",
              "調べる":"header-shiraberu.png",
              "巡る":"header-meguru.png",
          }

          def repl_nav(m):
              inner=m.group(1)
              for label,fn in mapping.items():
                  inner=re.sub(
                      r'(<a[^>]*>)'+re.escape(label)+r'(</a>)',
                      r'\1<img src="'+fn+r'" alt="'+label+r'">\2',
                      inner,
                      count=1
                  )
              return '<nav class="unified-nav">'+inner+'</nav>'

          s=re.sub(r'<nav class="unified-nav">([\s\S]*?)</nav>',repl_nav,s,count=1)

          css=r'''
          <style id="brush-header-images">
          .unified-brand{display:flex!important;align-items:center!important;height:72px!important}
          .unified-brand img{display:block;width:auto;height:27px;object-fit:contain}
          .unified-nav a{display:flex!important;align-items:center!important;justify-content:center!important;height:72px!important;padding:0 3px!important}
          .unified-nav a img{display:block;width:auto;height:24px;max-width:84px;object-fit:contain;filter:brightness(0) invert(1);opacity:.90;transition:opacity .2s ease,filter .2s ease,transform .2s ease}
          .unified-nav a:hover img,.unified-nav a.active img{opacity:1;filter:brightness(0) invert(82%) sepia(25%) saturate(620%) hue-rotate(355deg) brightness(97%);transform:translateY(-1px)}
          @media(max-width:900px){.unified-brand img{height:25px}}
          </style>
          '''
          if 'id="brush-header-images"' not in s:
              s=s.replace("</head>",css+"\n</head>",1)

          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "doinghistory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use instant brush images in top-page header"
          git push
