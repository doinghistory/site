<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>鍛える｜歴史する</title>



<style>
:root{
  --bg:#080807;
  --panel:#0d0d0c;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18);
  --text:#f0ede6;
  --muted:#918b81;
  --muted2:#6e685f;
  --serif:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--serif);letter-spacing:.04em
}
a{color:inherit;text-decoration:none}
button{font:inherit}

/* header */
header{
  height:74px;position:absolute;top:0;left:0;right:0;z-index:40
}
.header-inner{
  width:min(1280px,calc(100% - 48px));height:100%;margin:auto;
  display:flex;align-items:center;justify-content:space-between
}
.brand{font-size:1.24rem;letter-spacing:.18em}
.nav{display:flex;gap:26px;align-items:center;font-size:.77rem;color:#aaa49a}
.nav a.active{color:#fff;border-bottom:1px solid #fff;padding-bottom:5px}
.menu{font:500 1.3rem/1 var(--sans);color:#ddd}

/* hero */
.hero{
  min-height:430px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 76% 45%,rgba(255,255,255,.06),transparent 22%),
    linear-gradient(90deg,#050504 0%,#080807 58%,#0d0d0b 100%);
  border-bottom:1px solid var(--line);
}
.hero:before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 48%,#000 100%);
}
.hero-inner{
  position:relative;z-index:2;width:min(1280px,calc(100% - 48px));min-height:430px;margin:auto;
  display:grid;grid-template-columns:1fr 420px;align-items:center;gap:50px;padding-top:54px
}
.hero-copy{max-width:520px}
.eyebrow{font-size:.84rem;color:#c8c2b7;margin-bottom:12px}
.hero h1{
  margin:0;font-size:clamp(4.2rem,7vw,6.2rem);font-weight:500;line-height:.95;letter-spacing:.16em
}
.lead{margin-top:22px;font-size:1rem;line-height:1.95;color:#d0cabf}
.sub{margin-top:10px;font:400 .71rem/1.85 var(--sans);color:#888279}

/* visual meter */
.hero-meter{
  align-self:center;border-left:1px solid var(--line);padding-left:34px
}
.meter-label{font:500 .58rem/1 var(--sans);letter-spacing:.15em;color:#706a62;margin-bottom:18px}
.meter-line{display:flex;align-items:center;gap:12px;margin:14px 0}
.meter-line span:first-child{width:56px;font-size:.76rem;color:#9f998e}
.bar{height:1px;background:#4e4942;flex:1;position:relative}
.bar:after{content:"";position:absolute;left:0;top:-2px;height:5px;background:#ddd8cf}
.meter-line:nth-child(2) .bar:after{width:42%}
.meter-line:nth-child(3) .bar:after{width:66%}
.meter-line:nth-child(4) .bar:after{width:88%}
.meter-note{margin-top:18px;font:400 .63rem/1.7 var(--sans);color:#6f6961}

/* modes */
.modes{
  width:min(1180px,calc(100% - 48px));margin:auto;padding:48px 0 58px
}
.section-label{font:500 .6rem/1 var(--sans);letter-spacing:.16em;color:#6f6961;margin-bottom:16px}
.mode-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.mode-card{
  appearance:none;border:0;border-right:1px solid var(--line);
  background:transparent;color:var(--text);min-height:250px;padding:26px 28px;
  text-align:left;cursor:pointer;position:relative;transition:.2s
}
.mode-card:last-child{border-right:0}
.mode-card:hover{background:#0d0d0c}
.mode-card.active{background:#121210}
.mode-card small{
  display:block;font:500 .55rem/1 var(--sans);letter-spacing:.15em;color:#6f6961
}
.mode-card h2{margin:42px 0 10px;font-size:1.5rem;font-weight:500}
.mode-card p{margin:0;max-width:280px;font:400 .7rem/1.85 var(--sans);color:#8f897f}
.mode-foot{
  position:absolute;left:28px;right:28px;bottom:20px;
  display:flex;justify-content:space-between;font-size:.72rem;color:#b7b1a6
}

/* practice section */
.practice{
  border-top:1px solid var(--line);background:#090908;padding:54px 0 90px
}
.practice-inner{width:min(1120px,calc(100% - 48px));margin:auto}
.practice-head{
  display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:end;margin-bottom:24px
}
.practice-head .kicker{font-size:.9rem;color:#bbb5ab}
.practice-head .kicker:after{content:"";display:block;width:40px;height:1px;background:#514d46;margin-top:14px}
.practice-head h3{margin:0;font-size:2rem;font-weight:500}
.practice-head p{margin:8px 0 0;font:400 .7rem/1.8 var(--sans);color:#89837a}

/* era grid */
.era-block{border-top:1px solid var(--line)}
.era-row{
  display:grid;grid-template-columns:145px minmax(0,1fr);gap:22px;
  align-items:start;padding:18px 0;border-bottom:1px solid var(--line)
}
.era-name{font-size:1rem;letter-spacing:.08em;padding-top:10px;color:#d0cabf}
.era-subs{display:grid;grid-template-columns:repeat(4,minmax(92px,1fr));gap:8px}
.sub-era-btn{
  appearance:none;min-height:46px;border:1px solid var(--line);
  background:transparent;color:#8d877d;padding:10px 12px;cursor:pointer;transition:.2s
}
.sub-era-btn:hover{background:#0f0f0e;color:#fff;border-color:var(--line2)}
.sub-era-btn.active{color:#fff;border-color:#eee9df;background:#11110f}

/* list */
.detail{display:none;margin-top:34px;border-top:1px solid var(--line)}
.detail.show{display:block}
.detail-head{
  display:flex;justify-content:space-between;align-items:end;gap:20px;
  padding:20px 0 14px;border-bottom:1px solid var(--line)
}
.detail-head h4{margin:0;font-size:1.3rem;font-weight:500}
.detail-head p{margin:6px 0 0;font:400 .67rem/1.75 var(--sans);color:#858077}
.resource{
  min-height:84px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:110px minmax(0,1fr) 100px 24px;
  gap:18px;align-items:center;transition:.2s
}
.resource:hover{background:#0d0d0c;padding-left:8px;padding-right:8px}
.badge{
  width:max-content;border:1px solid var(--line);padding:7px 9px;
  font:500 .57rem/1 var(--sans);color:#9b958a
}
.title{font-size:.95rem;margin-bottom:4px}
.desc{font:400 .64rem/1.7 var(--sans);color:#817b72}
.meta{text-align:right;font:400 .59rem/1.6 var(--sans);color:#706a62}
.arrow{font:1rem var(--sans);color:#b8b2a8}

footer{
  border-top:1px solid var(--line);padding:22px 0 30px;
  color:#6d675f;font:400 .6rem/1.7 var(--sans)
}
.footer-inner{
  width:min(1120px,calc(100% - 48px));margin:auto;
  display:flex;justify-content:space-between
}

@media(max-width:900px){
  .nav{display:none}
  .hero-inner{grid-template-columns:1fr}
  .hero-meter{display:none}
  .mode-grid{grid-template-columns:1fr}
  .mode-card{border-right:0;border-bottom:1px solid var(--line)}
  .mode-card:last-child{border-bottom:0}
  .practice-head{grid-template-columns:1fr}
  .era-row{grid-template-columns:1fr;gap:10px}
  .era-name{padding-top:0}
  .era-subs{grid-template-columns:repeat(3,minmax(86px,1fr))}
  .resource{grid-template-columns:90px minmax(0,1fr) 24px}
  .meta,.desc{display:none}
}
@media(max-width:620px){
  .era-subs{grid-template-columns:repeat(2,1fr)}
}
</style>
<style>
/* 2026-09 humanized editorial pass */
:root{
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif CJK JP",serif;
  --sans:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Hiragino Kaku Gothic Pro","Meiryo",sans-serif;
}
body{letter-spacing:.025em}
.brand img,.logo img{display:block;width:118px;height:auto}
.hero h1{font-weight:600;letter-spacing:.10em}
.mode-no,.section-label,.kicker,.list-title,.tag,.num{letter-spacing:.08em}
</style></head>
<body>
<header>
<div class="header-inner">
<a class="brand" href="index.html"><img alt="歴史する" src="assets/logo.png"/></a>
<nav class="nav"><a href="manabu.html">学ぶ</a><a href="tou.html">問う</a><a class="active" href="kitaeru.html">鍛える</a><a href="miru.html">観る</a><a href="shiraberu.html">調べる</a><a href="meguru.html">巡る</a></nav>

</div>
</header>
<section class="hero">
<div class="hero-inner">
<div class="hero-copy">
<div class="eyebrow">問題演習</div>
<h1>鍛える</h1>
<div class="lead">過去問・正誤問題・演習プリント</div>
<div class="sub">時代と形式を選んで取り組みます。</div>
</div>

</div>
</section>
<section class="modes">
<div class="section-label">問題形式</div>
<div class="mode-grid">
<button class="mode-card active" data-mode="過去問演習">
<small>01</small>
<h2>過去問演習</h2>
<p>大学入試の過去問を使い、知識を本番の文脈で使う。</p>
<div class="mode-foot"><span>問題を見る</span><span>→</span></div>
</button>
<button class="mode-card" data-mode="正誤・組合せ問題">
<small>02</small>
<h2>正誤・組合せ問題</h2>
<p>細かな違いを見抜き、根拠をもって判断する。</p>
<div class="mode-foot"><span>問題を見る</span><span>→</span></div>
</button>
<button class="mode-card" data-mode="演習プリント">
<small>03</small>
<h2>演習プリント</h2>
<p>単元ごとにまとめて解き、弱点を確かめる。</p>
<div class="mode-foot"><span>教材を見る</span><span>→</span></div>
</button>
</div>
</section>
<section class="practice">
<div class="practice-inner">
<div class="practice-head">
<div class="kicker">時代を選ぶ</div>
<div>
<h3 id="practiceTitle">時代から問題を選ぶ</h3>
<p>必要な時代を選び、その単元の問題へ進みます。</p>
</div>
</div>
<div class="era-block" id="eraBlock"></div>
<div class="detail" id="detail">
<div class="detail-head">
<div>
<h4 id="detailTitle">鎌倉</h4>
<p id="detailCopy"></p>
</div>
</div>
<div id="resourceList"></div>
</div>
</div>
</section>
<footer>
<div class="footer-inner">
<span>歴史する</span>
<span>高校日本史教材</span>
</div>
</footer>
<script>
const SUB_ERAS={
  "古代":["旧石器","縄文","弥生","古墳","飛鳥","奈良","平安"],
  "中世":["鎌倉","南北朝","室町","戦国"],
  "近世":["安土桃山","江戸","幕末"],
  "近代":["明治","大正","昭和戦前"],
  "現代":["戦後","平成","令和"]
};

const COPY={
  "旧石器":"旧石器文化と列島形成を問題で確認する。",
  "縄文":"縄文社会の特徴と変化を問題で確かめる。",
  "弥生":"稲作・社会変化・対外関係を問題で整理する。",
  "古墳":"ヤマト政権と古墳文化を問題で確認する。",
  "飛鳥":"国家形成と仏教受容を問題で確かめる。",
  "奈良":"律令国家と奈良時代の社会を演習する。",
  "平安":"平安政治・社会・文化を問題で捉える。",
  "鎌倉":"武士政権の成立と展開を実戦問題で確認する。",
  "南北朝":"内乱と政治変化を問題で整理する。",
  "室町":"室町幕府・外交・社会・文化を演習する。",
  "戦国":"戦国大名と地域社会を問題で確認する。",
  "安土桃山":"統一政権と社会変化を問題で整理する。",
  "江戸":"幕藩体制・社会・文化を幅広く演習する。",
  "幕末":"開国から倒幕までの流れを問題で確かめる。",
  "明治":"近代国家形成と国民化を実戦問題で確認する。",
  "大正":"政党政治と大衆社会を問題で整理する。",
  "昭和戦前":"戦争と社会変化を問題で確かめる。",
  "戦後":"占領改革から現代社会までを演習する。",
  "平成":"平成期の政治・経済・社会を確認する。",
  "令和":"現代につながるテーマを問題で捉える。"
};

const DATA=[
  ["中世","鎌倉","過去問演習","共通テスト","鎌倉幕府の成立と御家人制","史料・図版を含む過去問演習。","PDF"],
  ["中世","鎌倉","正誤・組合せ問題","演習","鎌倉政治 正誤問題","制度や人物の違いを判断する。","PDF"],
  ["中世","鎌倉","演習プリント","プリント","鎌倉時代 総合演習","一問一答より一段深い確認問題。","PDF"],
  ["近世","江戸","過去問演習","私大","江戸社会と経済","経済史・社会史を中心とした過去問。","PDF"],
  ["近世","江戸","正誤・組合せ問題","演習","江戸政治 正誤・組合せ","改革・将軍・制度の組合せを確認する。","PDF"],
  ["近世","江戸","演習プリント","プリント","江戸時代 総合演習","政治・経済・文化を横断して演習する。","PDF"],
  ["近代","明治","過去問演習","国公立","明治国家の形成","近代国家形成をテーマにした入試問題。","PDF"],
  ["近代","明治","正誤・組合せ問題","演習","明治政治 正誤問題","政策・人物・条約を判断する。","PDF"],
  ["現代","戦後","演習プリント","プリント","戦後史 総合演習","占領改革から高度成長までを確認する。","PDF"]
].map(x=>({
  major:x[0],sub:x[1],mode:x[2],kind:x[3],title:x[4],desc:x[5],meta:x[6]
}));

let mode="過去問演習",major=null,sub=null;

function renderEras(){
  const block=document.getElementById("eraBlock");
  block.innerHTML=Object.entries(SUB_ERAS).map(([m,subs])=>`
    <div class="era-row">
      <div class="era-name">${m}</div>
      <div class="era-subs">
        ${subs.map(s=>`
          <button class="sub-era-btn ${major===m&&sub===s?"active":""}"
            data-major="${m}" data-sub="${s}">
            ${s}
          </button>
        `).join("")}
      </div>
    </div>
  `).join("");

  block.querySelectorAll(".sub-era-btn").forEach(btn=>{
    btn.onclick=()=>{
      major=btn.dataset.major;
      sub=btn.dataset.sub;
      renderEras();
      renderDetail();
      document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}

function renderDetail(){
  const d=document.getElementById("detail");
  document.getElementById("practiceTitle").textContent=`${mode}を、時代から。`;
  if(!major){d.classList.remove("show");return;}
  d.classList.add("show");
  document.getElementById("detailTitle").textContent=sub;
  document.getElementById("detailCopy").textContent=COPY[sub]||"";

  const rows=DATA.filter(r=>r.major===major&&r.sub===sub&&r.mode===mode);
  const list=document.getElementById("resourceList");
  if(!rows.length){
    list.innerHTML=`<div class="resource"><div class="badge">準備中</div><div><div class="title">この単元の教材はまだありません</div><div class="desc">教材を追加するとここに表示されます。</div></div><div class="meta">—</div><div class="arrow">→</div></div>`;
    return;
  }

  list.innerHTML=rows.map(r=>`
    <a href="#" class="resource">
      <div class="badge">${r.kind}</div>
      <div>
        <div class="title">${r.title}</div>
        <div class="desc">${r.desc}</div>
      </div>
      <div class="meta">${r.meta}</div>
      <div class="arrow">→</div>
    </a>
  `).join("");
}

document.querySelectorAll(".mode-card").forEach(btn=>{
  btn.onclick=()=>{
    mode=btn.dataset.mode;
    document.querySelectorAll(".mode-card").forEach(b=>b.classList.toggle("active",b===btn));
    renderDetail();
    document.querySelector(".practice").scrollIntoView({behavior:"smooth"});
  };
});

renderEras();
renderDetail();
</script>
</body>
</html>
