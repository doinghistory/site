<style>:root{
  --bg:#070706;
  --bg2:#0b0b0a;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --text:#f1eee7;
  --muted:#948e84;
  --muted2:#716b63;
  --hover:#0e0e0d;
  --serif:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--serif);letter-spacing:.04em
}
a{color:inherit;text-decoration:none}
button,select{font:inherit}

/* hero slimmer */
.hero{
  min-height:480px;position:relative;overflow:hidden;background:#050504
}
.hero-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(90deg,rgba(4,4,4,.86) 0%,rgba(4,4,4,.64) 32%,rgba(4,4,4,.18) 63%,rgba(4,4,4,.30) 100%),
    linear-gradient(180deg,rgba(4,4,4,.04),rgba(4,4,4,.06) 52%,rgba(4,4,4,.48) 100%),
    url("tou-buddha.jpg");
  background-size:cover;
  background-position:center 46%;
  filter:saturate(.70) contrast(1.04) brightness(.92)
}
.hero-inner{
  position:relative;z-index:2;width:min(1280px,calc(100% - 48px));min-height:480px;margin:auto;
  display:flex;align-items:center
}
.hero-copy{width:430px;padding-top:22px}
.eyebrow{font-size:.84rem;color:#c8c2b7;margin-bottom:12px}
.hero h1{
  margin:0;font-size:clamp(4.1rem,7vw,6.1rem);font-weight:500;line-height:.95;letter-spacing:.16em
}
.lead{margin-top:22px;font-size:.98rem;line-height:1.95;color:#d0cabf}
.sub{margin-top:10px;font:400 .71rem/1.85 var(--sans);color:#8d877d}

/* apps */
.apps{
  background:#090908;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.apps-inner{
  width:min(1180px,calc(100% - 48px));margin:auto;padding:46px 0 52px
}
.section-label{
  font:500 .61rem/1 var(--sans);letter-spacing:.15em;color:#777168;margin-bottom:16px
}
.apps-grid{
  display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.app{
  min-height:250px;padding:30px 32px 28px;position:relative;border-right:1px solid var(--line);
  transition:.25s;overflow:hidden
}
.app:last-child{border-right:0}
.app:hover{background:#0e0e0d}
.app-index{font:500 .56rem/1 var(--sans);letter-spacing:.16em;color:#68635c}
.app h2{margin:46px 0 12px;font-size:clamp(1.55rem,2.5vw,2.4rem);font-weight:500;letter-spacing:.08em}
.app p{margin:0;color:#928c82;font:400 .72rem/1.9 var(--sans);max-width:340px}
.app-foot{
  position:absolute;left:32px;right:32px;bottom:22px;display:flex;justify-content:space-between;align-items:center;
  font-size:.74rem;color:#c2bcb1
}
.app-foot:before{
  content:"";position:absolute;left:0;right:0;top:-13px;height:1px;background:var(--line)
}
.arrow{font:1rem var(--sans)}

/* print area */
.print{
  background:#080807;padding:58px 0 92px
}
.print-inner{
  width:min(1120px,calc(100% - 48px));margin:auto
}
.print-head{
  display:block;margin-bottom:28px
}
.print-head .kicker{font-size:.9rem;color:#bbb5ab}
.print-head .kicker:after{content:"";display:block;width:40px;height:1px;background:#514d46;margin-top:14px}
.print-head h2{margin:0;font-size:2rem;font-weight:500}
.print-head p{margin:8px 0 0;font:400 .7rem/1.8 var(--sans);color:#89837a}

.selector-layout{
  display:grid;grid-template-columns:220px minmax(0,1fr);gap:30px;align-items:start
}
.side-menu{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.mode-btn{
  appearance:none;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:#8b857b;
  text-align:left;padding:18px 16px;cursor:pointer;transition:.2s
}
.mode-btn:last-child{border-bottom:0}
.mode-btn:hover{background:var(--hover);color:#fff}
.mode-btn.active{background:#11110f;color:#fff}
.mode-btn small{
  display:block;font:500 .53rem/1 var(--sans);letter-spacing:.14em;color:#6f6961;margin-bottom:8px
}
.mode-btn strong{font-size:.98rem;font-weight:500;letter-spacing:.05em}

.content-panel{
  border-top:1px solid var(--line)
}
.panel-lead{
  display:flex;justify-content:space-between;align-items:end;gap:24px;
  padding:14px 0 14px;border-bottom:1px solid var(--line)
}
.panel-lead h3{margin:0;font-size:1.16rem;font-weight:500;letter-spacing:.05em}
.panel-lead p{margin:6px 0 0;font:400 .67rem/1.7 var(--sans);color:#857f76}
.panel-lead .note{font:400 .61rem/1.5 var(--sans);color:#6e685f}

.era-list{border-bottom:1px solid var(--line)}
.era-row{
  border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:145px minmax(0,1fr);gap:22px;
  align-items:start;min-height:96px;padding:18px 0
}
.era-row:last-child{border-bottom:0}
.era-name{
  font-size:1rem;letter-spacing:.08em;padding-top:10px;color:#d2ccc1
}
.era-subs{
  display:grid;grid-template-columns:repeat(4,minmax(92px,1fr));gap:8px
}
.sub-era-btn{
  appearance:none;border:1px solid var(--line);background:transparent;color:#8d877d;
  min-height:46px;padding:10px 12px;text-align:center;cursor:pointer;transition:.2s;
  font-size:.76rem;letter-spacing:.04em
}
.sub-era-btn:hover{
  background:#0f0f0e;color:#fff;border-color:rgba(255,255,255,.16)
}
.sub-era-btn.active{
  color:#fff;border-color:#f0ece3;background:#11110f
}

/* detail */
.detail{
  display:none;margin-top:34px;border-top:1px solid var(--line);padding-top:20px
}
.detail.show{display:block}
.detail-head{
  display:flex;justify-content:space-between;gap:24px;align-items:end;padding-bottom:14px;border-bottom:1px solid var(--line)
}
.detail-head h4{margin:0;font-size:1.32rem;font-weight:500}
.detail-head p{margin:7px 0 0;font:400 .68rem/1.8 var(--sans);color:#878178}
select{
  appearance:none;background:transparent;color:#d0cac0;border:1px solid var(--line2);padding:10px 14px;min-width:150px
}
.resource-list{border-bottom:1px solid var(--line)}
.resource{
  min-height:82px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:105px minmax(0,1fr) 80px 24px;gap:18px;align-items:center;transition:.2s
}
.resource:last-child{border-bottom:0}
.resource:hover{background:#0d0d0c;padding-left:8px;padding-right:8px}
.kind{
  font:500 .57rem/1 var(--sans);color:#9c968b;border:1px solid var(--line);padding:7px 9px;width:max-content
}
.title{font-size:.94rem;margin-bottom:4px}
.desc{font:400 .64rem/1.7 var(--sans);color:#817b72}
.meta{text-align:right;font:400 .59rem/1.5 var(--sans);color:#6f6961}
.empty-note{
  padding:24px 0;color:#7c766d;font:400 .67rem/1.8 var(--sans)
}

footer{
  border-top:1px solid var(--line);padding:22px 0 30px;color:#6d675f;font:400 .6rem/1.7 var(--sans)
}
.footer-inner{
  width:min(1120px,calc(100% - 48px));margin:auto;display:flex;justify-content:space-between
}

@media(max-width:900px){
  .nav{display:none}
  .hero{min-height:430px}
  .hero-inner{min-height:430px}
  .hero-copy{width:76%;padding-top:46px}
  .apps-grid{grid-template-columns:1fr}
  .app{border-right:0;border-bottom:1px solid var(--line)}
  .app:last-child{border-bottom:0}
  .print-head{grid-template-columns:1fr}
  .selector-layout{grid-template-columns:1fr}
  .side-menu{display:grid;grid-template-columns:repeat(3,1fr)}
  .mode-btn{border-bottom:0;border-right:1px solid var(--line)}
  .mode-btn:last-child{border-right:0}
  .era-row{grid-template-columns:1fr;gap:10px}
  .era-name{padding-top:0}
  .era-subs{grid-template-columns:repeat(3,minmax(86px,1fr))}
  .resource{grid-template-columns:90px minmax(0,1fr) 24px}
  .meta,.desc{display:none}
}
@media(max-width:620px){
  .side-menu{grid-template-columns:1fr}
  .mode-btn{border-right:0;border-bottom:1px solid var(--line)}
  .mode-btn:last-child{border-bottom:0}
}

/* ===== app cover update ===== */
.app{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding-right:150px !important;

.app-cover{
  position:absolute;
  right:24px;

@media(max-width:900px){

    border-right:0 !important;

  }
  .app:last-child{border-bottom:0}
  .app-cover{

    right:20px;
    top:20px;
  }
}
</style>

<script>
const SUB_ERAS={
  "古代":["旧石器","縄文","弥生","古墳","飛鳥","奈良","平安"],
  "中世":["鎌倉","南北朝","室町","戦国"],
  "近世":["安土桃山","江戸","幕末"],
  "近代":["明治","大正","昭和戦前"],
  "現代":["戦後","平成","令和"]
};
const COPY={
  "旧石器":"列島のはじまりと人びとの移動を考える。",
  "縄文":"暮らしの痕跡から社会と精神性をみる。",
  "弥生":"稲作が社会をどう変えたのかを考える。",
  "古墳":"権力の形成を古墳の形から読み解く。",
  "飛鳥":"国家形成と仏教受容のはじまりをみる。",
  "奈良":"律令国家の仕組みと都の姿を考える。",
  "平安":"貴族社会と地方の変化を捉える。",
  "鎌倉":"武士政権の成立と支配の仕組みをみる。",
  "南北朝":"動乱のなかで変わる権力を考える。",
  "室町":"幕府・都市・文化が重なる時代をみる。",
  "戦国":"地域権力と統一への動きをたどる。",
  "安土桃山":"統一政権と交流の広がりを考える。",
  "江戸":"都市と村がつながる社会をみる。",
  "幕末":"世界との接触と政治の揺れを追う。",
  "明治":"近代国家と国民化の始まりを考える。",
  "大正":"大衆社会と政党政治の展開をみる。",
  "昭和戦前":"戦争へ向かう社会の変化をみる。",
  "戦後":"占領改革と新しい社会の出発をみる。",
  "平成":"暮らしと社会の変化をふり返る。",
  "令和":"現在につながる歴史を考える。"
};
const CSV_URL=(window.HISTORY_SITE_CONFIG && window.HISTORY_SITE_CONFIG.SHEET_CSV_URL)||"";
let DATA=[];

function clean(v){return (v==null?"":String(v)).trim();}
function isPublishedValue(v){const s=clean(v).toLowerCase();return !["false","0","no","off","非公開","下書き"].includes(s);}
function placementAllows(v,target){const s=clean(v);return !s||s.includes(target);}
function orderValue(v){const s=clean(v);if(!s)return Number.POSITIVE_INFINITY;const n=Number(s);return Number.isFinite(n)?n:Number.POSITIVE_INFINITY;}
function parseCSV(text){
  const out=[]; let row=[], field="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c === '"' && text[i+1] === '"'){field+='"';i++;}
      else if(c === '"') quoted=false;
      else field+=c;
    }else{
      if(c === '"') quoted=true;
      else if(c === ","){row.push(field);field="";}
      else if(c === "\n"){row.push(field);out.push(row);row=[];field="";}
      else if(c !== "\r") field+=c;
    }
  }
  row.push(field);
  if(row.length>1 || row[0]) out.push(row);
  return out;
}
function normalizeEra(v){
  return clean(v).replace(/\s+/g,"").replace(/時代$/,"")
    .replace(/昭和前期|昭和・戦前|戦前昭和/,"昭和戦前")
    .replace(/昭和後期|昭和・戦後|昭和戦後/,"戦後")
    .replace(/安土・桃山|安土桃山時代/,"安土桃山");
}
function majorOf(v){
  const s=normalizeEra(v);
  if(/旧石器|縄文|弥生|古墳|飛鳥|奈良|平安|原始|古代/.test(s)) return "古代";
  if(/鎌倉|南北朝|室町|戦国|中世/.test(s)) return "中世";
  if(/安土桃山|江戸|幕末|近世/.test(s)) return "近世";
  if(/明治|大正|昭和戦前|戦前|近代/.test(s)) return "近代";
  if(/戦後|平成|令和|現代/.test(s)) return "現代";
  return "";
}
function subOf(v){
  const s=normalizeEra(v);
  for(const e of Object.values(SUB_ERAS).flat()){
    if(s.includes(e)) return e;
  }
  if(s.includes("昭和") && !s.includes("戦後")) return "昭和戦前";
  if(s.includes("昭和") && s.includes("戦後")) return "戦後";
  return "";
}
function modeOf(kind){
  const s=clean(kind);
  return ["一問一答","一文論述","年代整序"].find(m=>s.includes(m))||"";
}
function rowsFromCSV(text){
  const csv=parseCSV(text);
  if(!csv.length) return [];
  const h=csv[0].map(clean);
  return csv.slice(1).map(r=>{
    const o={}; h.forEach((k,i)=>o[k]=clean(r[i]));
    const rawEra=o["時代"]||"";
    const kind=o["種別"]||o["種類"]||"";
    const mode=modeOf(kind);
    const url=o["URL"]||o["リンク"]||"";
    return {
      major:majorOf(rawEra),
      sub:subOf(rawEra),
      mode,
      kind:kind||"教材",
      title:o["タイトル"]||o["教材名"]||"",
      desc:o["ひとこと説明"]||o["説明"]||o["概要"]||"",
      meta:o["形式"]||o["ファイル形式"]||(/\.pdf(?:$|\?)/i.test(url)?"PDF":"LINK"),
      placement:o["掲載先"]||"",
      published:isPublishedValue(o["公開"]),
      order:orderValue(o["表示順"]||o["順番"]||o["並び順"]),
      url
    };
  }).filter(x=>x.mode && x.major && x.sub && x.title && x.url && x.published && placementAllows(x.placement,"問う"));
}

function setupApps(){
  const cfg=(window.HISTORY_SITE_CONFIG&&window.HISTORY_SITE_CONFIG.APPS)||{};
  const pairs=[
    [document.getElementById("appYamakawa"),cfg.yamakawa],
    [document.getElementById("appJidai"),cfg.jidaiToNagare]
  ];
  pairs.forEach(([el,url])=>{
    if(!el) return;
    if(url){
      el.href=url;
      el.target="_blank";
      el.rel="noopener";
    }else{
      el.href="#";
      el.addEventListener("click",e=>e.preventDefault());
      el.title="実URL未設定";
      el.style.opacity=".55";
      el.querySelector(".app-foot span:first-child").textContent="URL未設定";
    }
  });
}

let mode="一問一答", major=null, sub=null;

function renderEraList(){
  const list=document.getElementById("eraList");
  list.innerHTML=Object.entries(SUB_ERAS).map(([m,subs])=>`
    <div class="era-row">
      <div class="era-name">${m}</div>
      <div class="era-subs">
        ${subs.map(s=>`
          <button class="sub-era-btn ${major===m && sub===s ? "active" : ""}" data-major="${m}" data-sub="${s}">
            ${s}
          </button>
        `).join("")}
      </div>
    </div>
  `).join("");

  list.querySelectorAll(".sub-era-btn").forEach(btn=>{
    btn.onclick=()=>{
      major=btn.dataset.major;
      sub=btn.dataset.sub;
      renderEraList();
      renderDetail();
      document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}
function renderDetail(){
  const detail=document.getElementById("detail");
  document.getElementById("panelTitle").textContent = `${mode}を選ぶ`;
  if(!major){detail.classList.remove("show");return;}
  detail.classList.add("show");
  const sel=document.getElementById("unitSelect");
  sel.innerHTML=SUB_ERAS[major].map(s=>`<option ${s===sub?"selected":""}>${s}</option>`).join("");
  sel.onchange=()=>{sub=sel.value;renderDetail();};
  document.getElementById("detailTitle").textContent=sub;
  document.getElementById("detailCopy").textContent=COPY[sub]||"";
  const rows=DATA.filter(r=>r.major===major&&r.sub===sub&&r.mode===mode).sort((a,b)=>a.order-b.order);
  const list=document.getElementById("resourceList");
  if(!rows.length){
    list.innerHTML=`<div class="empty-note">この単元・形式の教材はまだ登録されていません。</div>`;
  } else {
    list.innerHTML=rows.map(r=>`
      <a class="resource" href="${r.url}" target="_blank" rel="noopener">
        <div class="kind">${r.kind}</div>
        <div><div class="title">${r.title}</div><div class="desc">${r.desc}</div></div>
        <div class="meta">${r.meta}</div>
        <div class="arrow">→</div>
      </a>
    `).join("");
  }
}
document.querySelectorAll(".mode-btn").forEach(btn=>{
  btn.onclick=()=>{
    mode=btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b===btn));
    renderDetail();
  };
});
setupApps();
renderEraList();
renderDetail();

if(CSV_URL){
  fetch(CSV_URL,{cache:"no-store"})
    .then(r=>{if(!r.ok) throw new Error("CSV"); return r.text();})
    .then(text=>{ DATA=rowsFromCSV(text); renderDetail(); })
    .catch(()=>{ DATA=[]; renderDetail(); });
}
</script>
