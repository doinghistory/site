<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<title>問う｜歴史する</title>
<meta content="高校日本史の一問一答・一文論述・年代整序。知識を思い出し、説明し、並べる。" name="description"/>



<style>
:root{
  --paper:#f3f0e9;
  --ink:#181714;
  --muted:#756f65;
  --line:#d4cec2;
  --dark:#10100e;
  --accent:#4c493f;
  --accent2:#d8ccb4;
  --serif:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);letter-spacing:.04em;
}
a{color:inherit}
button{font:inherit}
::selection{background:#d8cfbc}

/* HEADER */
.site-header{
  height:78px;background:#faf8f3;border-bottom:1px solid rgba(0,0,0,.07);
  position:relative;z-index:30;
}
.header-inner{
  width:min(1280px,calc(100% - 52px));height:100%;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:28px;
}
.brand{text-decoration:none;line-height:1}
.brand-main{display:block;font-size:1.45rem;letter-spacing:.18em;font-weight:500}
.brand-sub{display:block;margin-top:7px;font:500 .56rem/1 var(--sans);letter-spacing:.24em;color:#686258}
.header-nav{display:flex;gap:30px;align-items:center}
.header-nav a{
  text-decoration:none;font-size:.82rem;padding:28px 2px 10px;border-bottom:1px solid transparent;
}
.header-nav a.active{border-color:#26231f}
.header-note{
  border-left:1px solid var(--line);padding-left:24px;
  font-size:.72rem;line-height:1.7;color:#655f56;
}

/* HERO */
.hero{
  height:470px;position:relative;overflow:hidden;background:#11100e;color:#fff;
}
.hero-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(90deg,rgba(7,7,6,.95) 0%,rgba(7,7,6,.83) 29%,rgba(7,7,6,.34) 58%,rgba(7,7,6,.67) 100%),
    url("tou-hero.jpg");
  background-size:cover;
  background-position:center 46%;
  filter:saturate(.72) contrast(1.04);
}
.hero-inner{
  position:relative;z-index:2;width:min(1280px,calc(100% - 52px));height:100%;margin:auto;
  display:flex;align-items:center;
}
.hero-copy{width:420px}
.hero-eyebrow{font-size:.9rem;margin-bottom:12px}
.hero h1{
  margin:0;font-size:clamp(3.7rem,8vw,6.6rem);font-weight:500;line-height:1;letter-spacing:.16em;
}
.hero-rule{width:40px;height:1px;background:#fff;margin:28px 0}
.hero p{margin:0;font-size:.84rem;line-height:2.1;max-width:360px}
.hero-vertical{
  position:absolute;right:30px;top:64px;writing-mode:vertical-rl;
  font-size:.8rem;letter-spacing:.19em;line-height:2;color:rgba(255,255,255,.9);
}

/* era nav */
.era-area{background:#f8f5ee;border-bottom:1px solid var(--line)}
.era-major{
  width:min(1180px,calc(100% - 52px));margin:auto;
  display:grid;grid-template-columns:repeat(5,1fr);padding-top:20px;
}
.major-btn{
  appearance:none;border:1px solid var(--line);border-right:0;
  background:transparent;color:#282520;cursor:pointer;height:58px;
  font-size:1.02rem;letter-spacing:.1em;transition:.2s;
}
.major-btn:last-child{border-right:1px solid var(--line)}
.major-btn:hover{background:#eee8de}
.major-btn.active{background:#ded3bd;border-color:#c6b793}
.sub-row{
  width:min(1180px,calc(100% - 52px));margin:auto;
  display:flex;justify-content:center;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:15px 0 19px;
}
.sub-row::-webkit-scrollbar{display:none}
.sub-btn{
  appearance:none;border:1px solid #d4cec2;background:transparent;color:#6b655d;
  padding:8px 18px;cursor:pointer;flex:0 0 auto;font-size:.76rem;letter-spacing:.06em;
}
.sub-btn:hover{background:#ebe5dc}
.sub-btn.active{background:#ded1b3;border-color:#c8b68d;color:#25211c}

/* MAIN */
.main{padding:54px 0 90px}
.inner{width:min(1280px,calc(100% - 52px));margin:auto}
.intro{
  display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;align-items:end;margin-bottom:46px;
}
.intro-label{font-size:.97rem}
.intro-label:after{content:"";display:block;width:42px;height:1px;background:#39362f;margin-top:16px}
.intro h2{
  margin:0;font-size:clamp(2rem,4.2vw,3.5rem);line-height:1.42;font-weight:500;letter-spacing:.08em;
}
.intro p{margin:12px 0 0;color:#676158;font:400 .77rem/1.95 var(--sans);max-width:720px}

/* three modes */
.mode-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);border-left:1px solid var(--line);
}
.mode-card{
  min-height:270px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:#f8f5ef;padding:26px 26px 24px;position:relative;overflow:hidden;cursor:pointer;
  transition:.22s;
}
.mode-card:hover{background:#eee9df}
.mode-card.active{background:#ded3bd}
.mode-no{font:500 .59rem/1 var(--sans);letter-spacing:.18em;color:#8a8277}
.mode-card h3{margin:44px 0 13px;font-size:1.7rem;font-weight:500;letter-spacing:.08em}
.mode-card p{margin:0;color:#6e675e;font:400 .72rem/1.9 var(--sans);max-width:290px}
.mode-card .action{
  position:absolute;left:26px;bottom:23px;font-size:.74rem;display:flex;align-items:center;gap:14px;
}
.mode-card .action:after{content:"";display:block;width:36px;height:1px;background:#69635b}
.mode-word{
  position:absolute;right:-3px;top:10px;font-size:6.6rem;line-height:1;color:rgba(55,49,40,.045);
  font-weight:600;
}

/* resource section */
.resource-section{margin-top:46px}
.resource-head{
  display:flex;align-items:end;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:0;
}
.resource-head h3{margin:0;font-size:1.22rem;font-weight:500;letter-spacing:.1em}
.resource-head .line{width:40px;height:1px;background:#777168}
.resource-head p{margin:0;color:#827b70;font:400 .66rem/1.6 var(--sans)}
.resource-count{margin-left:auto;color:#91897f;font:400 .64rem/1.6 var(--sans)}

.resource-list{border-bottom:1px solid var(--line)}
.resource-row{
  min-height:106px;border-top:1px solid var(--line);display:grid;
  grid-template-columns:132px minmax(0,1fr) 150px 34px;gap:22px;align-items:center;
  text-decoration:none;transition:.2s;
}
.resource-row:first-child{border-top:0}
.resource-row:hover{background:rgba(255,255,255,.45);padding-left:8px;padding-right:8px}
.res-kind{
  font:500 .62rem/1 var(--sans);letter-spacing:.11em;color:#756e64;
  border:1px solid var(--line-dark);padding:7px 10px;width:max-content;
}
.res-title{font-size:.98rem;line-height:1.55;margin-bottom:5px}
.res-desc{font:400 .69rem/1.7 var(--sans);color:#7c756b}
.res-meta{text-align:right;color:#948d82;font:400 .63rem/1.65 var(--sans)}
.res-arrow{font:1rem var(--sans)}

.empty{
  padding:52px 20px;text-align:center;border-top:1px solid var(--line);
  color:#877f74;font:400 .76rem/1.8 var(--sans);
}

/* web app callout */
.app-callout{
  display:none;margin-top:26px;border:1px solid #c9bea6;background:#e8dfcd;
  padding:24px 26px;grid-template-columns:1fr auto;gap:20px;align-items:center;
}
.app-callout.show{display:grid}
.app-callout h4{margin:0 0 6px;font-size:1rem;font-weight:500}
.app-callout p{margin:0;font:400 .7rem/1.75 var(--sans);color:#6c655b}
.app-callout a{
  text-decoration:none;border:1px solid #877d69;padding:10px 18px;font-size:.73rem;background:#f7f3eb;
}

/* footer */
.footer{
  border-top:1px solid var(--line);padding:22px 0 32px;
  color:#8c857a;font:400 .61rem/1.7 var(--sans);
}
.footer-inner{
  width:min(1280px,calc(100% - 52px));margin:auto;display:flex;justify-content:space-between;gap:20px;
}

@media(max-width:960px){
  .header-note{display:none}
  .mode-grid{grid-template-columns:1fr}
  .mode-card{min-height:210px}
  .intro{grid-template-columns:1fr}
  .resource-row{grid-template-columns:115px minmax(0,1fr) 30px}
  .res-meta{display:none}
}
@media(max-width:720px){
  .header-nav{display:none}
  .site-header{height:70px}
  .header-inner,.hero-inner,.inner,.footer-inner{width:calc(100% - 28px)}
  .brand-main{font-size:1.2rem}
  .hero{height:470px}
  .hero-bg{
    background-position:46% 45%;
    background-image:
      linear-gradient(90deg,rgba(7,7,6,.93) 0%,rgba(7,7,6,.8) 44%,rgba(7,7,6,.4) 80%,rgba(7,7,6,.6) 100%),
      url("tou-hero.jpg");
  }
  .hero-copy{width:75%}
  .hero-vertical{display:none}
  .era-major{width:100%;overflow-x:auto;grid-template-columns:repeat(5,145px);padding-left:14px;padding-right:14px}
  .sub-row{width:calc(100% - 28px);justify-content:flex-start}
  .main{padding-top:42px}
  .resource-row{grid-template-columns:94px minmax(0,1fr) 24px;gap:14px}
  .res-desc{display:none}
  .app-callout.show{grid-template-columns:1fr}
}
</style>
<style>
/* 2026-09 humanized editorial pass */
:root{
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif CJK JP",serif;
  --sans:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Hiragino Kaku Gothic Pro","Meiryo",sans-serif;
}
body{letter-spacing:.025em}
.brand img,.logo img{display:block;width:118px;height:auto}
.hero h1{font-weight:600;letter-spacing:.10em}
.mode-no,.section-label,.kicker,.list-title,.tag,.num{letter-spacing:.08em}
</style></head>
<body>
<header class="site-header">
<div class="header-inner">
<a class="brand" href="index.html"><img alt="歴史する" src="assets/logo.png"/></a>
<nav class="header-nav"><a href="manabu.html">学ぶ</a><a class="active" href="tou.html">問う</a><a href="kitaeru.html">鍛える</a><a href="miru.html">観る</a><a href="shiraberu.html">調べる</a><a href="meguru.html">巡る</a></nav>

</div>
</header>
<section class="hero">
<div class="hero-bg"></div>
<div class="hero-inner">
<div class="hero-copy">
<div class="hero-eyebrow">一問一答・一文論述・年代整序</div>
<h1>問う</h1>
<div class="hero-rule"></div>
<p>問題形式を選び、時代別に取り組めます。</p>
</div>
</div>

</section>
<section class="era-area">
<div class="era-major">
<button class="major-btn active" data-major="古代">古代</button>
<button class="major-btn" data-major="中世">中世</button>
<button class="major-btn" data-major="近世">近世</button>
<button class="major-btn" data-major="近代">近代</button>
<button class="major-btn" data-major="現代">現代</button>
</div>
<div class="sub-row" id="subRow"></div>
</section>
<main class="main">
<div class="inner">
<div class="intro">
<div class="intro-label" id="eraLabel">古代</div>
<div>
<h2>問題形式を選ぶ</h2>
<p>一問一答・一文論述・年代整序から選んでください。</p>
</div>
</div>
<section aria-label="問題形式を選ぶ" class="mode-grid">
<button class="mode-card active" data-mode="一問一答">
<div class="mode-no">01</div>
<div class="mode-word">答</div>
<h3>一問一答</h3>
<p>まずは思い出す。プリントとWebアプリで、知識の定着を確かめます。</p>
<div class="action">教材を見る</div>
</button>
<button class="mode-card" data-mode="一文論述">
<div class="mode-no">02</div>
<div class="mode-word">文</div>
<h3>一文論述</h3>
<p>用語や出来事を、短い一文で説明する。覚えた知識を、自分の言葉に変えます。</p>
<div class="action">教材を見る</div>
</button>
<button class="mode-card" data-mode="年代整序">
<div class="mode-no">03</div>
<div class="mode-word">順</div>
<h3>年代整序</h3>
<p>出来事を並べることで、因果関係と時代の流れを確かめます。</p>
<div class="action">教材を見る</div>
</button>
</section>

<section class="resource-section">
<div class="resource-head">
<h3 id="resourceTitle">一問一答</h3>
<span class="line"></span>
<p id="resourceSub">教材</p>
<div class="resource-count"><span id="count">0</span> 件</div>
</div>
<div class="resource-list" id="resourceList"></div>
</section>
</div>
</main>
<footer class="footer">
<div class="footer-inner">
<span>歴史する</span>
<span>高校日本史教材</span>
</div>
</footer>
<script>
const SUB_ERAS={
  "古代":["旧石器","縄文","弥生","古墳","飛鳥","奈良","平安"],
  "中世":["鎌倉","南北朝","室町","戦国"],
  "近世":["安土桃山","江戸","幕末"],
  "近代":["明治","大正","昭和戦前"],
  "現代":["戦後","平成","令和"]
};

const RESOURCES=[
  {major:"古代",sub:"縄文",mode:"一問一答",kind:"プリント",title:"縄文・弥生 一問一答",desc:"基本事項を短時間で確認するプリント。",meta:"PDF",url:"#"},
  {major:"古代",sub:"飛鳥",mode:"一問一答",kind:"プリント",title:"飛鳥〜奈良 一問一答",desc:"律令国家形成期の重要語句を確認します。",meta:"PDF",url:"#"},
  {major:"中世",sub:"鎌倉",mode:"一問一答",kind:"プリント",title:"鎌倉時代 一問一答",desc:"人物・制度・出来事の基本事項を確認します。",meta:"PDF",url:"#"},
  {major:"近世",sub:"江戸",mode:"一問一答",kind:"プリント",title:"江戸時代 一問一答",desc:"政治・社会・文化を横断して確認します。",meta:"PDF",url:"#"},
  {major:"近代",sub:"明治",mode:"一問一答",kind:"プリント",title:"明治時代 一問一答",desc:"近代国家形成の重要事項を確認します。",meta:"PDF",url:"#"},
  {major:"現代",sub:"戦後",mode:"一問一答",kind:"プリント",title:"戦後史 一問一答",desc:"占領改革から高度成長までを確認します。",meta:"PDF",url:"#"},

  {major:"古代",sub:"古墳",mode:"一文論述",kind:"プリント",title:"古墳はなぜ巨大化したのか",desc:"理由を一文で説明する短文論述です。",meta:"PDF",url:"#"},
  {major:"中世",sub:"鎌倉",mode:"一文論述",kind:"プリント",title:"御恩と奉公を一文で説明する",desc:"用語同士の関係を短く説明します。",meta:"PDF",url:"#"},
  {major:"近世",sub:"江戸",mode:"一文論述",kind:"プリント",title:"幕藩体制とは何か",desc:"制度を自分の言葉で短くまとめます。",meta:"PDF",url:"#"},
  {major:"近代",sub:"明治",mode:"一文論述",kind:"プリント",title:"廃藩置県の意味を説明する",desc:"出来事の意味を一文で説明します。",meta:"PDF",url:"#"},
  {major:"現代",sub:"戦後",mode:"一文論述",kind:"プリント",title:"高度経済成長を一文で説明する",desc:"変化の特徴を短くまとめます。",meta:"PDF",url:"#"},

  {major:"古代",sub:"奈良",mode:"年代整序",kind:"プリント",title:"古代 年代整序",desc:"古代の出来事を時系列に並べます。",meta:"PDF",url:"#"},
  {major:"中世",sub:"室町",mode:"年代整序",kind:"プリント",title:"中世 年代整序",desc:"鎌倉から室町までの流れを整理します。",meta:"PDF",url:"#"},
  {major:"近世",sub:"幕末",mode:"年代整序",kind:"プリント",title:"近世 年代整序",desc:"江戸政治と幕末の出来事を並べます。",meta:"PDF",url:"#"},
  {major:"近代",sub:"大正",mode:"年代整序",kind:"プリント",title:"近代 年代整序",desc:"明治から大正の出来事を時系列で確認します。",meta:"PDF",url:"#"},
  {major:"現代",sub:"戦後",mode:"年代整序",kind:"プリント",title:"戦後史 年代整序",desc:"戦後日本の主要事項を順序で確認します。",meta:"PDF",url:"#"}
];

let currentMajor="古代";
let currentSub="";
let currentMode="一問一答";

function setFromUrl(){
  const p=new URLSearchParams(location.search);
  const era=p.get("era")||"";
  const mode=p.get("mode")||"";
  if(SUB_ERAS[era]) currentMajor=era;
  for(const m of Object.keys(SUB_ERAS)){
    if(SUB_ERAS[m].includes(era)){currentMajor=m;currentSub=era;}
  }
  if(["一問一答","一文論述","年代整序"].includes(mode)) currentMode=mode;
}
function updateUrl(){
  const u=new URL(location.href);
  u.searchParams.set("era",currentSub||currentMajor);
  u.searchParams.set("mode",currentMode);
  history.replaceState(null,"",u);
}
function renderSub(){
  const row=document.getElementById("subRow");
  row.innerHTML=
    `<button class="sub-btn ${currentSub===""?"active":""}" data-sub="">すべて</button>`+
    SUB_ERAS[currentMajor].map(s=>
      `<button class="sub-btn ${currentSub===s?"active":""}" data-sub="${s}">${s}</button>`
    ).join("");
  row.querySelectorAll(".sub-btn").forEach(btn=>{
    btn.onclick=()=>{
      currentSub=btn.dataset.sub||"";
      updateUrl();render();
    };
  });
}
function filtered(){
  return RESOURCES.filter(r=>{
    if(r.major!==currentMajor) return false;
    if(currentSub && r.sub!==currentSub) return false;
    if(r.mode!==currentMode) return false;
    return true;
  });
}
function render(){
  document.querySelectorAll(".major-btn").forEach(
    b=>b.classList.toggle("active",b.dataset.major===currentMajor)
  );
  document.querySelectorAll(".mode-card").forEach(
    b=>b.classList.toggle("active",b.dataset.mode===currentMode)
  );
  renderSub();
  document.getElementById("eraLabel").textContent=currentSub||currentMajor;
  document.getElementById("resourceTitle").textContent=currentMode;
  document.getElementById("resourceSub").textContent=
    currentMode==="一問一答" ? "プリント・Web" :
    currentMode==="一文論述" ? "短文論述" : "年代整序";

  const data=filtered();
  document.getElementById("count").textContent=data.length;
  const list=document.getElementById("resourceList");

  if(!data.length){
    list.innerHTML='<div class="empty">この条件の教材は、まだ登録されていません。</div>';
    return;
  }

  list.innerHTML=data.map(r=>`
    <a class="resource-row" href="${r.url}">
      <div><span class="res-kind">${r.kind}</span></div>
      <div>
        <div class="res-title">${r.title}</div>
        <div class="res-desc">${r.desc}</div>
      </div>
      <div class="res-meta">${r.sub}<br>${r.meta}</div>
      <div class="res-arrow">→</div>
    </a>
  `).join("");
}

document.querySelectorAll(".major-btn").forEach(btn=>{
  btn.onclick=()=>{
    currentMajor=btn.dataset.major;
    currentSub="";
    updateUrl();render();
  };
});
document.querySelectorAll(".mode-card").forEach(btn=>{
  btn.onclick=()=>{
    currentMode=btn.dataset.mode;
    updateUrl();render();
    document.querySelector(".resource-section").scrollIntoView({behavior:"smooth",block:"start"});
  };
});

setFromUrl();
render();
</script>
</body>
</html>
