<section class="hero"><div><h1>学ぶ</h1></div><div class="hero-art" role="img" aria-label="狩野永徳《唐獅子図屏風》を用いた歴史するの表紙"></div></section>
<main class="catalog" id="catalog"><div class="catalog-inner">
  <div class="era-heading"><h2>時代を選ぶ</h2><div class="eras" id="eras" role="group" aria-label="時代を選ぶ"></div></div>
  <div class="chapter-heading"><h2 id="title">原始・古代</h2><span class="chapter-number" id="chapter">第一章</span></div>
  <div id="list" class="lesson-list" aria-live="polite"></div>
  <p class="catalog-footnote" id="catalog-note"></p>
</div></main><footer>歴史する｜高校日本史<p class="footer-credit">狩野永徳《唐獅子図屏風》右隻／皇居三の丸尚蔵館所蔵　画像：Wikimedia Commons</p></footer>
<script>
// 教材登録欄：{number:1,era:"原始・古代",title:"授業名",description:"授業の問い",print:"PDFのURL",slides:"スライドのURL"}
// 実際の授業だけを登録する。未登録の教材を架空の授業名で表示しない。
const lessons=[];
const eras=["原始・古代","中世","近世","近代","現代"];
const chapters=["第一章","第二章","第三章","第四章","第五章"];
let era=eras[0];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeUrl(url){const s=String(url||"").trim();return /^(https?:\/\/|\.\.?\/|[\w-]+\/)[^\s]*$/i.test(s)?esc(s):""}
function render(){
 document.getElementById("eras").innerHTML=eras.map(e=>'<button type="button" data-era="'+e+'" class="'+(e===era?'active':'')+'" aria-pressed="'+(e===era)+'">'+e+'</button>').join("");
 document.getElementById("title").textContent=era;
 document.getElementById("chapter").textContent=chapters[eras.indexOf(era)];
 const rows=lessons.filter(x=>x.era===era);
 document.getElementById("list").innerHTML=rows.length?rows.map((x,i)=>{
 const n=String(x.number??i+1).padStart(2,"0"),id="lesson-"+i;
 const p=safeUrl(x.print),v=safeUrl(x.slides);
 return '<article class="lesson"><button class="lesson-toggle" type="button" aria-expanded="false" aria-controls="'+id+'"><span class="lesson-index">第'+n+'講</span><span class="lesson-num">'+n+'</span><span class="lesson-title">'+esc(x.title)+'</span><span class="lesson-arrow" aria-hidden="true">⌄</span></button><div class="lesson-detail" id="'+id+'" hidden>'+(x.description?'<p>'+esc(x.description)+'</p>':'')+'<div class="lesson-links">'+(p?'<a class="resource-link" href="'+p+'" target="_blank" rel="noopener noreferrer">授業プリント ↗</a>':'<span class="resource-missing">授業プリント 準備中</span>')+(v?'<a class="resource-link" href="'+v+'" target="_blank" rel="noopener noreferrer">授業スライド ↗</a>':'<span class="resource-missing">授業スライド 準備中</span>')+'</div></div></article>'
 }).join(""):'<div class="catalog-empty"><div><span aria-hidden="true"></span>教材は順次掲載します。</div></div>';
 document.getElementById("catalog-note").textContent=rows.length?"":"";
}
document.getElementById("eras").addEventListener("click",e=>{const b=e.target.closest("button[data-era]");if(b){era=b.dataset.era;render()}});
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".lesson-toggle");if(!b)return;const panel=document.getElementById(b.getAttribute("aria-controls"));const expanded=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!expanded));panel.hidden=expanded});
render();
</script><script src="site-header.js?v=20260923h3"></script></body></html>
