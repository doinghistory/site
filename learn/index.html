<section class="hero"><div><h1>学ぶ</h1></div><div class="hero-art" role="img" aria-label="狩野永徳《唐獅子図屏風》を用いた歴史するの表紙"></div></section>
<main class="catalog"><aside class="sidebar"><h2>時代から選ぶ</h2><div class="eras" id="eras"></div></aside><section><div class="heading"><h2 id="title">すべての時代</h2></div><div class="tabs" id="tabs"><button class="active" data-type="all">すべて</button><button data-type="print">授業プリント</button><button data-type="slides">授業スライド</button></div><p class="count" id="count"></p><div id="list"></div><p class="note">授業プリント・授業スライドは、公開準備が整ったものから掲載します。</p></section></main><footer>歴史する｜高校日本史<p class="footer-credit">狩野永徳《唐獅子図屏風》右隻／皇居三の丸尚蔵館所蔵　画像：Wikimedia Commons</p></footer>
<script>
// 教材登録欄：{number:1,era:"原始・古代",title:"授業名",description:"授業の問い",print:"PDFのURL",slides:"スライドのURL"}
// 実在しない授業・未登録の教材は公開しない。
const lessons=[];
const eras=["すべて","原始・古代","中世","近世","近代","現代"];let era="すべて",type="all";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.getElementById("eras").innerHTML=eras.map(e=>'<button class="'+(era===e?'active':'')+'" data-era="'+e+'">'+e+'</button>').join("");document.getElementById("title").textContent=era==="すべて"?"すべての時代":era;const q="";const rows=lessons.filter(x=>(era==="すべて"||x.era===era)&&[x.number,x.title,x.description,x.era].join(" ").toLowerCase().includes(q)&&(type==="all"||(type==="print"?Boolean(x.print):Boolean(x.slides))));document.getElementById("count").textContent=rows.length+"件";document.getElementById("list").innerHTML=rows.length?rows.map(x=>'<article class="lesson"><span class="num">'+x.number+'</span><div class="thumb">'+esc(x.era)+'</div><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><div class="actions">'+(type!=="slides"?(x.print?'<a target="_blank" rel="noopener" href="'+esc(x.print)+'">授業プリント ↗</a>':'<span>プリント準備中</span>'):'')+(type!=="print"?(x.slides?'<a target="_blank" rel="noopener" href="'+esc(x.slides)+'">授業スライド ↗</a>':'<span>スライド準備中</span>'):'')+'</div></div></article>').join("") :'<div class="empty"><h3 style="font-size:22px;font-weight:400">'+(lessons.length?'該当する教材はありません':'教材は準備中です')+'</h3><p style="font-size:14px;line-height:2;color:#6f746b">'+(lessons.length?'別の時代やキーワードでお探しください。':'授業プリントと授業スライドを順次公開します。')+'</p></div>'}
document.getElementById("eras").addEventListener("click",e=>{const b=e.target.closest("button[data-era]");if(b){era=b.dataset.era;render()}});document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-type]");if(b){type=b.dataset.type;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));render()}});render();
</script><script src="site-header.js?v=20260923h3"></script></body></html>
