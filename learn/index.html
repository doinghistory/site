*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f5ee;color:#263329;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}a{color:inherit;text-decoration:none}.top{background:#202c24;color:#f7f3e8;padding:22px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:25px;letter-spacing:.15em}.top nav{display:flex;gap:24px;font-size:14px}.top nav a[aria-current]{border-bottom:1px solid #d8c9a3}.hero{background:#202c24;color:white;min-height:400px;display:grid;grid-template-columns:180px 1fr;gap:22px;padding:32px 5vw 50px}.hero h1{font-size:clamp(72px,10vw,150px);font-weight:400;writing-mode:vertical-rl;line-height:1.1;margin:0}.hero p{writing-mode:vertical-rl;letter-spacing:.25em;line-height:2}.hero-art{border:1px solid #736a4d;background:#4c4332 url("https://commons.wikimedia.org/wiki/Special:FilePath/Kano_Eitoku_002.jpg") center / cover no-repeat;display:grid;place-items:center;min-height:360px}.hero-art span{font-size:clamp(24px,4vw,60px);color:#f2e6c9;letter-spacing:.15em}.top a:focus-visible,.eras button:focus-visible,.tabs button:focus-visible,.search:focus-visible{outline:2px solid #ae8c54;outline-offset:3px}.top nav a:hover,.actions a:hover{opacity:.75}.empty{min-height:180px}.catalog{max-width:1250px;margin:auto;padding:75px 28px;display:grid;grid-template-columns:200px 1fr;gap:70px}.sidebar h2{font-size:13px;font-weight:400;margin:0 0 20px}.eras{display:flex;flex-direction:column;align-items:stretch;gap:8px}.eras button{font:inherit;font-size:17px;border:0;background:none;text-align:left;padding:10px 14px;cursor:pointer;color:#263329}.eras button.active{color:#8e422e;border-left:2px solid #8e422e}.heading{border-bottom:1px solid #4e554e;display:flex;justify-content:space-between;align-items:end;gap:12px;padding-bottom:22px}.heading h2{font-size:32px;font-weight:400;margin:0}.heading p{font-size:13px;margin:0}.tabs{display:flex;gap:22px;border-bottom:1px solid #c9c9c0}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0;font:inherit;cursor:pointer;color:#3c493f}.tabs button.active{border-bottom-color:#263329}.count{font-size:12px;color:#687268;margin:20px 0}.lesson{border-bottom:1px solid #cccac1;display:grid;grid-template-columns:64px 90px 1fr;align-items:center;gap:22px;padding:24px 0}.num{font-size:29px;color:#9c8a64}.thumb{height:75px;background:linear-gradient(130deg,#b8a078,#5e654e);display:grid;place-items:center;color:#fff;font-size:12px}.lesson h3{font-size:23px;font-weight:400;margin:0 0 8px}.lesson p{font-size:13px;margin:0 0 12px;color:#666e65}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a,.actions span{font-size:13px;border:1px solid #9ca69a;padding:9px 15px}.actions span{color:#9a9b93;border-color:#d7d7ce}.empty{padding:40px 0}.note{font-size:12px;color:#6f746b;line-height:1.8;margin-top:24px}footer{background:#202c24;color:#ddd6c4;padding:35px 5vw;font-size:13px}.footer-credit{color:#d8c9ac;text-align:right;margin:24px 0 0;font-size:11px;line-height:1.6}@media(max-width:750px){.top{padding:17px 20px}.top nav{gap:12px;font-size:12px}.brand{font-size:19px}.hero{grid-template-columns:90px 1fr;min-height:260px;padding:20px 16px 28px;gap:10px}.hero h1{font-size:68px}.hero p{font-size:11px}.hero-art{min-height:245px}.hero-art span{font-size:22px}.catalog{display:block;padding:42px 18px}.sidebar h2{margin-bottom:8px}.eras{flex-direction:row;overflow-x:auto;gap:6px;margin-bottom:30px}.eras button{font-size:13px;white-space:nowrap;border:1px solid #d3d5cb;padding:9px}.eras button.active{border:1px solid #8e422e}.heading h2{font-size:26px}.heading p{font-size:11px}.lesson{grid-template-columns:44px 70px 1fr;gap:12px}.num{font-size:23px}.thumb{height:65px}.lesson h3{font-size:18px}.lesson p{font-size:12px}.actions a,.actions span{padding:8px 9px;font-size:12px}}
</style></head><body>
<header class="top"><a class="brand" href="../">歴史する</a><nav><a href="./" aria-current="page">学ぶ</a><a href="../">観る</a><a href="../">問う</a><a href="../">巡る</a></nav></header>
<section class="hero"><div><h1>学ぶ</h1></div><div class="hero-art" role="img" aria-label="狩野永徳《唐獅子図屏風》を用いた歴史するの表紙"></div></section>
<main class="catalog"><aside class="sidebar"><h2>時代から選ぶ</h2><div class="eras" id="eras"></div></aside><section><div class="heading"><h2 id="title">すべての時代</h2></div><div class="tabs" id="tabs"><button class="active" data-type="all">すべて</button><button data-type="print">授業プリント</button><button data-type="slides">授業スライド</button></div><p class="count" id="count"></p><div id="list"></div><p class="note">授業プリント・授業スライドは、公開準備が整ったものから掲載します。</p></section></main><footer>歴史する｜高校日本史<p class="footer-credit">狩野永徳《唐獅子図屏風》右隻／皇居三の丸尚蔵館所蔵　画像：Wikimedia Commons</p></footer>
<script>
// 教材登録欄：{number:1,era:"原始・古代",title:"授業名",description:"授業の問い",print:"PDFのURL",slides:"スライドのURL"}
// 実在しない授業・未登録の教材は公開しない。
const lessons=[];
const eras=["すべて","原始・古代","中世","近世","近代","現代"];let era="すべて",type="all";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.getElementById("eras").innerHTML=eras.map(e=>'<button class="'+(era===e?'active':'')+'" data-era="'+e+'">'+e+'</button>').join("");document.getElementById("title").textContent=era==="すべて"?"すべての時代":era;const q="";const rows=lessons.filter(x=>(era==="すべて"||x.era===era)&&[x.number,x.title,x.description,x.era].join(" ").toLowerCase().includes(q)&&(type==="all"||(type==="print"?Boolean(x.print):Boolean(x.slides))));document.getElementById("count").textContent=rows.length+"件";document.getElementById("list").innerHTML=rows.length?rows.map(x=>'<article class="lesson"><span class="num">'+x.number+'</span><div class="thumb">'+esc(x.era)+'</div><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><div class="actions">'+(type!=="slides"?(x.print?'<a target="_blank" rel="noopener" href="'+esc(x.print)+'">授業プリント ↗</a>':'<span>プリント準備中</span>'):'')+(type!=="print"?(x.slides?'<a target="_blank" rel="noopener" href="'+esc(x.slides)+'">授業スライド ↗</a>':'<span>スライド準備中</span>'):'')+'</div></div></article>').join("") :'<div class="empty"><h3 style="font-size:22px;font-weight:400">'+(lessons.length?'該当する教材はありません':'教材は準備中です')+'</h3><p style="font-size:14px;line-height:2;color:#6f746b">'+(lessons.length?'別の時代やキーワードでお探しください。':'授業プリントと授業スライドを順次公開します。')+'</p></div>'}
document.getElementById("eras").addEventListener("click",e=>{const b=e.target.closest("button[data-era]");if(b){era=b.dataset.era;render()}});document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-type]");if(b){type=b.dataset.type;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));render()}});render();
</script></body></html>
