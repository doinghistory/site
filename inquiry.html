<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>探究室｜歴史する</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="doinghistory.css">
</head>
<body class="inquiry" data-page="inquiry">
<div class="noise"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="prototype.html"><strong>歴史する</strong><small>DOING HISTORY</small></a>
    <nav class="room-nav" aria-label="部屋を移動する">
      <a href="library.html">教材書庫</a>
      <a href="theater.html">映像室</a>
      <a href="archive.html">史料室</a>
      <a href="inquiry.html">探究室</a>
    </nav>
    <a class="home-link" href="./#gates">入口へ</a>
  </div>
</header>
<main>
  <section class="room-hero shell">
    <div class="kicker">ROOM 04 / INQUIRY</div>
    <h1>問いから、<br>歴史をはじめる。</h1>
    <p class="inquiry-lead">ここでは教材ではなく「問い」を選びます。</p>
    <p style="margin-top:12px">資料を読み、仮説を立て、別の見方と比べる。知識を受け取る場所ではなく、自分で歴史を組み立てるための部屋です。</p>
    <div class="rule"></div>
  </section>
  <section class="shell">
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="問い・テーマから探す"></div>
      <div class="count"><span id="count">0</span> 問</div>
    </div>
    <div class="pills" id="eraPills" style="margin-bottom:22px"></div>
    <div class="question-grid" id="content"><div class="empty"><strong>問いを準備中</strong>探究テーマを読み込んでいます。</div></div>

    <div class="method">
      <div class="step"><b>01</b><span>問いを立てる</span></div>
      <div class="step"><b>02</b><span>史料を読む</span></div>
      <div class="step"><b>03</b><span>仮説をつくる</span></div>
      <div class="step"><b>04</b><span>歴史を語り直す</span></div>
    </div>
  </section>
</main>
<div class="footer">歴史する ｜ 探究室</div>
<script src="doinghistory.js"></script>
</body></html>
